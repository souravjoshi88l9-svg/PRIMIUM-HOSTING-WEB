{% extends "dashboard_base.html" %}
{% block content %}
<h2>Dashboard</h2>
<p class="sub">Welcome, {{ session.get('name','User') }}</p>
<div class="stats-grid">
  <div class="card"><div class="card-label">Bots</div><div class="card-value">{{ stats.bots if stats else 0 }}</div></div>
  <div class="card"><div class="card-label">Running</div><div class="card-value">{{ stats.running if stats else 0 }}</div></div>
</div>
<div style="margin-top:1rem;display:flex;gap:0.75rem;flex-wrap:wrap">
  <a class="btn btn-primary" href="{{ url_for('upload_bot') }}">Upload Bot</a>
  <a class="btn btn-ghost" href="{{ url_for('github_deploy') }}">GitHub Deploy</a>
  <a class="btn btn-ghost" href="{{ url_for('bots') }}">My Bots</a>
</div>
{% endblock %}
